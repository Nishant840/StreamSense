[supervisord]
nodaemon=true
user=root

[program:fastapi]
command=uvicorn main:app --host 0.0.0.0 --port 8000
directory=/app/server
autostart=true
autorestart=true
stderr_logfile=/var/log/fastapi.err.log
stdout_logfile=/var/log/fastapi.out.log

[program:service-a]
command=uvicorn main:app --host 0.0.0.0 --port 8002
directory=/app/services/service_a
autostart=true
autorestart=true
stderr_logfile=/var/log/service-a.err.log
stdout_logfile=/var/log/service-a.out.log

[program:service-b]
command=uvicorn worker:app --host 0.0.0.0 --port 8003
directory=/app/services/service_b
autostart=true
autorestart=true
stderr_logfile=/var/log/service-b.err.log
stdout_logfile=/var/log/service-b.out.log

[program:service-c]
command=uvicorn cron:app --host 0.0.0.0 --port 8004
directory=/app/services/service_c
autostart=true
autorestart=true
stderr_logfile=/var/log/service-c.err.log
stdout_logfile=/var/log/service-c.out.log

[program:drain_parser]
command=python drain_parser.py
directory=/app/pipeline
autostart=true
autorestart=true
stderr_logfile=/var/log/drain_parser.err.log
stdout_logfile=/var/log/drain_parser.out.log

[program:anomaly_scorer]
command=python anomaly_scorer.py
directory=/app/pipeline
autostart=true
autorestart=true
stderr_logfile=/var/log/anomaly_scorer.err.log
stdout_logfile=/var/log/anomaly_scorer.out.log
